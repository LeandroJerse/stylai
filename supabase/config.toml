# Development configuration only. No cloud project is linked or created.
project_id = "stylai-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "12MiB"

[auth]
enabled = true
site_url = "http://localhost:5190"
additional_redirect_urls = ["http://localhost:5190"]
jwt_expiry = 900
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
