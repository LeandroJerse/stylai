<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StylAI — conexão TikTok</title>
<h1>Conectar TikTok Shop</h1><p>Acesso exclusivo ao operador da integração. Use sua conta existente do aplicativo StylAI.</p>
<form id="login"><label>E-mail <input name="email" type="email" autocomplete="username" required></label><label>Senha <input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<section id="controls" hidden><p id="connection"></p><button id="connect" disabled>Conectar ou revisar autorização TikTok</button><button id="disconnect">Desconectar localmente</button><button id="logout">Sair</button></section>
<p role="status" id="status"></p><p>A desconexão local não revoga a autorização no TikTok. Para isso, remova todo o acesso na página de autorização do TikTok.</p><script src="/console.js" defer></script></html>
